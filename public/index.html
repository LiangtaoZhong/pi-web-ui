<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Web UI</title>
<style>
/* ─── Theme Variables ────────────────────────────────────────────────── */
:root {
  --bg: #0f1117; --bg2: #151821; --bg3: #1c1f2e; --bg4: #242838;
  --border: #2a2d3e;
  --text: #e1e4ed; --text2: #8b8fa8; --text3: #5c6080;
  --accent: #6c8cff; --accent-hover: #8ba4ff; --accent-bg: rgba(108,140,255,0.1);
  --red: #ff5c6c; --red-bg: rgba(255,92,108,0.1);
  --green: #44d9a8; --green-bg: rgba(68,217,168,0.08);
  --yellow: #ffb84d; --yellow-bg: rgba(255,184,77,0.08);
  --code-bg: #1a1d2e; --code-border: #2a2d3e;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
  --radius: 12px; --radius-sm: 8px; --radius-xs: 5px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  --mono: "JetBrains Mono", "Fira Code", "Cascadia Code", "SF Mono", monospace;
}
[data-theme="light"] {
  --bg: #f5f6fa; --bg2: #ffffff; --bg3: #f0f1f5; --bg4: #e8e9f0;
  --border: #dde0e8;
  --text: #1a1c2e; --text2: #6b7094; --text3: #a0a4c0;
  --accent: #4f6ef7; --accent-hover: #3d5ce5; --accent-bg: rgba(79,110,247,0.08);
  --red: #e64555; --red-bg: rgba(230,69,85,0.08);
  --green: #2eaf7d; --green-bg: rgba(46,175,125,0.08);
  --yellow: #d9911e; --yellow-bg: rgba(217,145,30,0.08);
  --code-bg: #eef0f5; --code-border: #dde0e8;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
}
/* ─── Reset & Base ───────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  height:100vh;display:flex;overflow:hidden;
  transition:background .25s,color .25s;
}
/* ─── Sidebar ────────────────────────────────────────────────────────── */
.sidebar{
  width:310px;min-width:310px;background:var(--bg2);
  border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;
  transition:background .25s,border-color .25s;
}
.sidebar-head{
  padding:14px 16px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.sb-logo{font-size:17px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:6px}
.theme-btn{
  width:42px;height:24px;border-radius:14px;background:var(--bg3);border:1px solid var(--border);
  cursor:pointer;position:relative;padding:0;transition:all .25s;
}
.theme-btn::after{
  content:"";position:absolute;top:2px;left:3px;width:18px;height:18px;border-radius:50%;
  background:var(--accent);transition:transform .25s;
}
[data-theme="light"] .theme-btn::after{transform:translateX(16px)}

.sess-list{flex:1;overflow-y:auto;padding:8px 10px}
.sess-item{
  padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;
  margin-bottom:3px;transition:all .15s;border:1px solid transparent;
  display:flex;align-items:center;gap:10px;position:relative;
}
.sess-item:hover{background:var(--bg3)}
.sess-item.active{background:var(--accent-bg);border-color:var(--accent)}
.sess-item .si-av{width:32px;height:32px;border-radius:6px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.sess-item .si-info{flex:1;min-width:0}
.sess-item .si-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-item .si-ws{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.sess-item .si-meta{font-size:10px;color:var(--text3);margin-top:1px}
.sess-item .si-del{
  opacity:0;background:none;border:none;color:var(--text2);cursor:pointer;
  padding:2px 6px;border-radius:4px;font-size:14px;transition:all .15s;flex-shrink:0;
}
.sess-item:hover .si-del{opacity:1}
.sess-item .si-del:hover{color:var(--red);background:var(--red-bg)}

.sidebar-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:6px}
.sidebar-foot button{
  flex:1;padding:9px;border:none;border-radius:var(--radius-sm);
  font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;
}
.btn1{background:var(--accent);color:#fff}.btn1:hover{background:var(--accent-hover)}
.btn2{background:var(--bg3);color:var(--text);border:1px solid var(--border)}.btn2:hover{background:var(--bg4)}

/* ─── Main ───────────────────────────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
.chat-top{
  padding:0 18px;height:46px;min-height:46px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;transition:border-color .25s;
}
.chat-top .ct-title{font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-top .ct-ws{
  font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px;
  cursor:pointer;padding:3px 10px;border-radius:12px;background:var(--bg3);
  transition:all .15s;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border:1px solid transparent;
}
.chat-top .ct-ws:hover{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.ct-badge{
  font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;
}
.ct-badge.ok{background:var(--bg3);color:var(--text2)}
.ct-badge.live{background:var(--accent-bg);color:var(--accent);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ─── Messages ───────────────────────────────────────────────────────── */
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.msgs:empty::after{
  content:"发送消息开始对话";display:block;text-align:center;color:var(--text3);
  padding:40px;font-size:13px;
}

.msg{max-width:86%;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}}
.msg.user{align-self:flex-end}
.msg.user .bub{
  background:var(--accent);color:#fff;border-radius:var(--radius) var(--radius) 4px var(--radius);
  padding:10px 15px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
}
.msg.assistant{align-self:flex-start}
.msg.assistant .bub{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius) var(--radius) var(--radius) 4px;
  padding:15px 18px;font-size:14px;line-height:1.7;
  transition:background .25s,border-color .25s;min-width:60px;
}
.msg.assistant.streaming .bub{border-color:var(--accent)}

/* ─── Rich Text in Bubbles ───────────────────────────────────────────── */
.bub-body h1,.bub-body h2,.bub-body h3{margin:14px 0 6px;font-weight:700;line-height:1.3}
.bub-body h1{font-size:1.3em}.bub-body h2{font-size:1.15em}.bub-body h3{font-size:1.05em}
.bub-body p{margin:0 0 6px}.bub-body p:last-child{margin-bottom:0}
.bub-body ul,.bub-body ol{margin:6px 0;padding-left:20px}
.bub-body li{margin:2px 0}
.bub-body a{color:var(--accent)}
.bub-body blockquote{
  border-left:3px solid var(--accent);padding:4px 12px;margin:8px 0;
  color:var(--text2);background:var(--bg3);border-radius:0 var(--radius-xs) var(--radius-xs) 0;
}
.bub-body table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
.bub-body th,.bub-body td{border:1px solid var(--border);padding:5px 10px;text-align:left}
.bub-body th{background:var(--bg3);font-weight:600}
.bub-body hr{border:none;border-top:1px solid var(--border);margin:12px 0}

.bub-body pre{
  background:var(--code-bg);border:1px solid var(--code-border);border-radius:var(--radius-sm);
  padding:12px 15px;overflow-x:auto;margin:8px 0;font-size:13px;line-height:1.5;position:relative;
}
.bub-body pre code{font-family:var(--mono);font-size:12.5px;background:none!important;padding:0!important}
.bub-body code{
  font-family:var(--mono);font-size:12.5px;background:var(--code-bg);
  padding:2px 5px;border-radius:3px;border:1px solid var(--code-border);
}

.copy-btn{
  position:absolute;top:6px;right:6px;opacity:0;
  background:var(--bg4);border:1px solid var(--border);color:var(--text2);
  padding:2px 8px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .15s;
}
.bub-body pre:hover .copy-btn{opacity:1}
.copy-btn:hover{background:var(--accent-bg);color:var(--accent)}

/* ─── Thinking ───────────────────────────────────────────────────────── */
.think{
  background:var(--yellow-bg);border:1px solid rgba(255,184,77,.2);border-radius:var(--radius-sm);
  margin:8px 0;overflow:hidden;
}
.think>summary{
  padding:7px 12px;cursor:pointer;font-size:11px;font-weight:700;color:var(--yellow);
  display:flex;align-items:center;gap:5px;user-select:none;text-transform:uppercase;letter-spacing:.4px;
}
.think>summary::-webkit-details-marker{display:none}
.think>summary::before{content:"▶";font-size:8px;transition:transform .2s;display:inline-block}
.think[open]>summary::before{transform:rotate(90deg)}
.think .tc{padding:0 12px 10px;font-size:12.5px;color:var(--text2);white-space:pre-wrap;line-height:1.6;max-height:300px;overflow-y:auto}

/* ─── Tool ───────────────────────────────────────────────────────────── */
.tool{
  background:var(--green-bg);border:1px solid rgba(68,217,168,.18);border-radius:var(--radius-sm);
  margin:8px 0;overflow:hidden;
}
.tool>summary{
  padding:7px 12px;cursor:pointer;font-size:11px;font-weight:700;color:var(--green);
  display:flex;align-items:center;gap:6px;user-select:none;
}
.tool>summary::-webkit-details-marker{display:none}
.tool>summary::before{content:"▶";font-size:8px;transition:transform .2s;display:inline-block}
.tool[open]>summary::before{transform:rotate(90deg)}
.tool .tb{padding:0 12px 10px}
.tool .ta{font-size:11px;color:var(--text2);white-space:pre-wrap;word-break:break-all;font-family:var(--mono);margin-bottom:5px}
.tool .tr{
  background:var(--code-bg);border:1px solid var(--code-border);border-radius:var(--radius-xs);
  padding:8px 10px;font-size:12px;white-space:pre-wrap;overflow-x:auto;max-height:240px;overflow-y:auto;
  font-family:var(--mono);line-height:1.5;
}
.tool .ts{font-size:11px;color:var(--yellow);padding:7px 12px}

/* ─── Input ──────────────────────────────────────────────────────────── */
.input-zone{border-top:1px solid var(--border);padding:12px 18px;transition:border-color .25s}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-row textarea{
  flex:1;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius);color:var(--text);font-size:14px;font-family:inherit;
  line-height:1.5;resize:none;outline:none;min-height:44px;max-height:160px;
  transition:border-color .2s,box-shadow .2s;
}
.input-row textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.input-row .ib{
  padding:10px 20px;border:none;border-radius:var(--radius);font-size:14px;font-weight:700;
  cursor:pointer;transition:all .15s;white-space:nowrap;height:44px;
}
.ib-send{background:var(--accent);color:#fff}.ib-send:hover{background:var(--accent-hover)}
.ib-send:disabled{opacity:.4;cursor:not-allowed}
.ib-abort{background:var(--red);color:#fff;display:none}.ib-abort:hover{filter:brightness(.9)}

.img-preview{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.img-preview .ip{
  position:relative;width:48px;height:48px;border-radius:6px;overflow:hidden;border:1px solid var(--border);
}
.img-preview .ip img{width:100%;height:100%;object-fit:cover}
.img-preview .ip button{
  position:absolute;top:1px;right:1px;background:rgba(0,0,0,.75);color:#fff;
  border:none;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* ─── Empty ──────────────────────────────────────────────────────────── */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);gap:8px}
.empty .eicon{font-size:52px;opacity:.5}
.empty h2{font-size:18px;font-weight:700;color:var(--text)}
.empty p{font-size:13px;text-align:center;max-width:340px;line-height:1.6}

/* ─── File Browser Modal ─────────────────────────────────────────────── */
.m-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;
  display:flex;align-items:center;justify-content:center;animation:fadeIn .15s;
}
@keyframes fadeIn{from{opacity:0}}
.m-box{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);width:540px;max-height:450px;display:flex;flex-direction:column;
  animation:popIn .2s ease;
}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(10px)}}
.m-head{
  padding:12px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.m-head h3{font-size:14px;font-weight:700}
.m-close{background:none;border:none;color:var(--text2);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:4px}
.m-close:hover{color:var(--text);background:var(--bg3)}
.m-nav{padding:8px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.m-nav .mpath{flex:1;font-size:11px;color:var(--text2);font-family:var(--mono);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-nav button{
  padding:3px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;
  font-size:11px;color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.m-nav button:hover{background:var(--accent-bg);color:var(--accent)}
.m-body{flex:1;overflow-y:auto;padding:4px 8px 8px}
.m-body .mi{
  display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:6px;
  cursor:pointer;transition:all .1s;font-size:13px;
}
.m-body .mi:hover{background:var(--bg3)}
.m-body .mi.sel{background:var(--accent-bg);color:var(--accent);font-weight:600}
.m-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.m-foot button{padding:7px 18px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.m-cancel{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.m-ok{background:var(--accent);color:#fff}

/* ─── Toast ──────────────────────────────────────────────────────────── */
.toasts{position:fixed;bottom:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:6px}
.toast{
  padding:10px 16px;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius-sm);font-size:13px;color:var(--text);
  box-shadow:var(--shadow);animation:slideUp .3s ease;max-width:380px;
}
.toast.err{border-color:var(--red);color:var(--red)}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}}

/* ─── Scrollbar ──────────────────────────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
</style>
</head>
<body>

<!-- ═══ SIDEBAR ═══════════════════════════════════════════════════════════ -->
<aside class="sidebar">
  <div class="sidebar-head">
    <span class="sb-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20"/><path d="M2 12h20"/></svg>
      Pi Web UI
    </span>
    <button class="theme-btn" onclick="toggleTheme()" title="切换主题"></button>
  </div>
  <div class="sess-list" id="sessionList"></div>
  <div class="sidebar-foot">
    <button class="btn1" onclick="createSession()">+ 新建</button>
    <button class="btn2" onclick="refreshSessions()">↻</button>
  </div>
</aside>

<!-- ═══ MAIN ═══════════════════════════════════════════════════════════════ -->
<main class="main">
  <div class="chat-top" id="chatTop" style="display:none">
    <span class="ct-title" id="ctTitle"></span>
    <span class="ct-ws" id="ctWs" onclick="openBrowser()" title="点击切换工作区">📁 <span id="ctWsLabel"></span></span>
    <span class="ct-badge ok" id="ctBadge">idle</span>
  </div>

  <div class="empty" id="emptyState">
    <span class="eicon">💬</span>
    <h2>选择或创建一个 Session</h2>
    <p>在左侧面板创建新 Session 或点击已有 Session，即可在此与 Pi 对话</p>
  </div>

  <div class="msgs" id="messages" style="display:none"></div>

  <div class="input-zone" id="inputZone" style="display:none">
    <div class="img-preview" id="imgPrev" style="display:none"></div>
    <div class="input-row">
      <textarea id="msgInput" placeholder="输入消息... Enter 发送, Shift+Enter 换行, Ctrl+V 贴图" rows="1"></textarea>
      <button class="ib ib-send" id="sendBtn" onclick="sendMsg()" disabled>发送</button>
      <button class="ib ib-abort" id="abortBtn" onclick="doAbort()">中断</button>
    </div>
  </div>
</main>

<div class="toasts" id="toastBox"></div>

<!-- ═══ SCRIPTS ════════════════════════════════════════════════════════════ -->
<script src="/socket.io/socket.io.js"></script>
<script>
// ─── Simple Markdown Parser (no CDN dependency) ──────────────────────────
const MD = {
  parse(text) {
    if (!text) return "";
    let html = this._escape(text);
    // Code blocks (fenced)
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
      const escaped = this._escape(code.trim());
      const cls = lang ? ` class="lang-${lang}"` : "";
      return `<pre><code${cls}>${escaped}</code><button class="copy-btn" onclick="copyCode(this)">复制</button></pre>`;
    });
    // Inline code
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    // Bold
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    // Italic
    html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    // Headers
    html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
    html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
    html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>");
    // Blockquote
    html = html.replace(/^&gt; (.+)$/gm, "<blockquote>$1</blockquote>");
    // Horizontal rule
    html = html.replace(/^---$/gm, "<hr>");
    // Unordered lists
    html = html.replace(/^[\-\*] (.+)$/gm, "<li>$1</li>");
    html = html.replace(/(<li>.*<\/li>)\n(?=<li>)/g, "$1");
    html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, "<ul>$1</ul>");
    // Ordered lists
    html = html.replace(/^\d+\. (.+)$/gm, "<li>$1</li>");
    // Links
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    // Paragraphs (double newline)
    html = html.replace(/\n\n+/g, "</p><p>");
    // Wrap in paragraph
    if (!html.startsWith("<h") && !html.startsWith("<pre") && !html.startsWith("<ul") && !html.startsWith("<blockquote") && !html.startsWith("<li")) {
      html = "<p>" + html + "</p>";
    }
    return html;
  },
  _escape(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
};

function copyCode(btn) {
  const code = btn.parentElement.querySelector("code");
  if (!code) return;
  navigator.clipboard.writeText(code.textContent).then(() => {
    btn.textContent = "已复制!";
    setTimeout(() => { btn.textContent = "复制"; }, 1500);
  }).catch(() => { btn.textContent = "失败"; });
}

function esc(s) { return MD._escape(s); }

// ─── State ────────────────────────────────────────────────────────────────
const LS_KEY_SESSION = "pi-web-ui-sid";
const LS_KEY_THEME = "pi-web-ui-theme";
const socket = io();
let activeSid = null;
let pendingImgs = [];
let curAsst = null;       // Current streaming assistant DOM element
let curToolEls = {};      // toolCallId → details element
let streamBuf = { text: "", thinking: "", toolCalls: [] };

// ─── DOM ──────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const $sl = $("sessionList"), $msgs = $("messages"), $inp = $("msgInput");
const $send = $("sendBtn"), $abort = $("abortBtn"), $empty = $("emptyState");
const $top = $("chatTop"), $ctTitle = $("ctTitle"), $ctBadge = $("ctBadge");
const $ctWs = $("ctWs"), $ctWsLabel = $("ctWsLabel"), $izone = $("inputZone");
const $imgPrev = $("imgPrev"), $toasts = $("toastBox");

// ─── Theme ────────────────────────────────────────────────────────────────
function toggleTheme() {
  const h = document.documentElement;
  const n = h.getAttribute("data-theme") === "light" ? "dark" : "light";
  h.setAttribute("data-theme", n);
  localStorage.setItem(LS_KEY_THEME, n);
}
(function(){
  document.documentElement.setAttribute("data-theme", localStorage.getItem(LS_KEY_THEME) || "dark");
})();

// ─── Toast ────────────────────────────────────────────────────────────────
function toast(msg, isErr) {
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  $toasts.appendChild(el);
  setTimeout(() => { el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),300); }, 3500);
}

/* Show Pi's stderr as toast */
socket.on("pi_stderr", (d) => {
  console.log("[pi stderr]", d.text);
  // Don't spam the user with every stderr line
});

// ─── Session List ─────────────────────────────────────────────────────────
let sessCache = [];
async function refreshSessions() {
  try {
    const r = await fetch("/api/sessions");
    sessCache = await r.json();
    renderSessions();
  } catch(e) { console.error("refreshSessions:", e); }
}
function renderSessions() {
  $sl.innerHTML = sessCache.map(s => `
    <div class="sess-item${s.id===activeSid?' active':''}" onclick="joinSession('${s.id}')">
      <div class="si-av">💬</div>
      <div class="si-info">
        <div class="si-name">${esc(s.name)}</div>
        <div class="si-ws">${esc(s.workspace)}</div>
        <div class="si-meta">${s.messageCount||0} msg${s.streaming?' · live':''}</div>
      </div>
      <button class="si-del" onclick="event.stopPropagation();delSession('${s.id}')">✕</button>
    </div>
  `).join("") || '<div style="padding:16px;color:var(--text2);font-size:13px;text-align:center">暂无 Session<br><small>点击「+ 新建」开始</small></div>';
}

// ─── Session Actions ──────────────────────────────────────────────────────
function createSession() {
  socket.emit("session_create", { name: "Session " + new Date().toLocaleTimeString("zh-CN"), workspace: "" });
}
socket.on("session_created", (d) => {
  joinSession(d.id);
  refreshSessions();
});

function joinSession(id) {
  if (activeSid === id) return;
  activeSid = id;
  curAsst = null; curToolEls = {}; streamBuf = { text:"", thinking:"", toolCalls:[] };

  // Save for page reload
  localStorage.setItem(LS_KEY_SESSION, id);

  showChat();
  $msgs.innerHTML = "";
  renderSessions();
  socket.emit("session_join", { sessionId: id });
}

socket.on("session_history", (d) => {
  if (d.sessionId !== activeSid) return;
  $ctTitle.textContent = d.name || "Session";
  $ctWsLabel.textContent = d.workspace || "/";
  setBadge(d.streaming);
  $msgs.innerHTML = "";
  if (d.messages && d.messages.length > 0) {
    d.messages.forEach(m => appendMsg(m));
  }
  scrollBot();
  if (d.streaming) enterStreamMode();
  $inp.focus();
});

async function delSession(id) {
  if (!confirm("确定删除此 Session？")) return;
  await fetch(`/api/sessions/${id}`, { method: "DELETE" });
  if (activeSid === id) resetToEmpty();
  refreshSessions();
}
socket.on("session_deleted", ({ id }) => {
  if (activeSid === id) resetToEmpty();
  refreshSessions();
});

function resetToEmpty() {
  activeSid = null; curAsst = null; curToolEls = {}; streamBuf = { text:"", thinking:"", toolCalls:[] };
  localStorage.removeItem(LS_KEY_SESSION);
  $empty.style.display = "flex"; $msgs.style.display = "none"; $izone.style.display = "none"; $top.style.display = "none";
  $msgs.innerHTML = "";
}

function showChat() {
  $empty.style.display = "none"; $msgs.style.display = "flex"; $izone.style.display = "block"; $top.style.display = "flex";
}
function setBadge(streaming) {
  $ctBadge.textContent = streaming ? "streaming" : "idle";
  $ctBadge.className = "ct-badge " + (streaming ? "live" : "ok");
}
function enterStreamMode() { $send.style.display="none"; $abort.style.display="inline-block"; }
function leaveStreamMode() { $send.style.display="inline-block"; $abort.style.display="none"; $send.disabled = true; }

// ─── File Browser ─────────────────────────────────────────────────────────
let fbCur = "";
async function openBrowser() {
  fbCur = $ctWsLabel.textContent || "/";
  await showBrowser(fbCur);
}
async function showBrowser(dir) {
  // Remove existing
  document.querySelector(".m-overlay")?.remove();
  try {
    const r = await fetch(`/api/browse?path=${encodeURIComponent(dir)}`);
    const d = await r.json();
    fbCur = d.current;

    const roots = (d.roots||[]).map(rt =>
      `<button onclick="showBrowser('${esc(rt.path)}')">${esc(rt.name)}</button>`
    ).join("");
    const items = d.items.map(it =>
      `<div class="mi${it.path===fbCur?' sel':''}" onclick="fbPick('${esc(it.path)}')">📁 ${esc(it.name)}</div>`
    ).join("") || '<div style="padding:16px;color:var(--text2);text-align:center">没有子目录</div>';

    const ov = document.createElement("div");
    ov.className = "m-overlay";
    ov.innerHTML = `<div class="m-box" onclick="event.stopPropagation()">
      <div class="m-head"><h3>选择工作区</h3><button class="m-close" onclick="fbClose()">✕</button></div>
      <div class="m-nav">
        ${roots}
        <button onclick="showBrowser('${esc(d.parent||dir)}')" ${!d.parent?'disabled':''}>⬆ 上级</button>
        <span class="mpath">${esc(fbCur)}</span>
      </div>
      <div class="m-body">${items}</div>
      <div class="m-foot">
        <button class="m-cancel" onclick="fbClose()">取消</button>
        <button class="m-ok" onclick="fbConfirm()">确认</button>
      </div>
    </div>`;
    ov.addEventListener("click", (e) => { if (e.target===ov) fbClose(); });
    document.body.appendChild(ov);
  } catch(e) { toast("浏览失败: "+e.message, true); }
}
function fbPick(p) { fbCur = p; showBrowser(p); }
function fbClose() { document.querySelector(".m-overlay")?.remove(); }
function fbConfirm() {
  document.querySelector(".m-overlay")?.remove();
  if (activeSid && fbCur) {
    socket.emit("session_update_workspace", { sessionId: activeSid, workspace: fbCur });
    $ctWsLabel.textContent = fbCur;
    $msgs.innerHTML = "";
    toast("工作区 → " + fbCur);
  }
}
socket.on("workspace_updated", ({ workspace }) => { $ctWsLabel.textContent = workspace; });

// ─── Send Message ─────────────────────────────────────────────────────────
function sendMsg() {
  const txt = $inp.value.trim();
  if ((!txt && pendingImgs.length===0) || !activeSid) return;

  const imgs = [...pendingImgs]; pendingImgs = [];
  $imgPrev.style.display = "none"; $imgPrev.innerHTML = "";

  // Add user bubble immediately
  if (txt) appendMsg({ role: "user", content: txt });
  else if (imgs.length) appendMsg({ role: "user", content: "[图片]" });

  socket.emit("prompt", {
    sessionId: activeSid,
    message: txt || "(image)",
    images: imgs.length>0 ? imgs : undefined
  });

  $inp.value = ""; $inp.style.height = "auto";
  $send.disabled = true;
  scrollBot();
}
function doAbort() { if (activeSid) socket.emit("abort", { sessionId: activeSid }); }

// ─── Pi Events ────────────────────────────────────────────────────────────
socket.on("pi_event", (ev) => {
  if (!activeSid) return;
  switch (ev.type) {
    case "agent_start":
      setBadge(true); enterStreamMode();
      startAsstBubble();
      break;
    case "agent_end":
    case "agent_settled":
      setBadge(false); leaveStreamMode();
      finishAsstBubble(ev.messages);
      break;
    case "message_start":
      if (ev.message?.role === "assistant") startAsstBubble();
      break;
    case "message_update":
      updateAsst(ev.assistantMessageEvent);
      break;
    case "message_end":
      if (ev.message?.role === "assistant" && ev.message.content) {
        finishAsstBubble([ev.message]);
      }
      break;
    case "tool_execution_start":
      ensureToolBlock(ev.toolCallId, ev.toolName, ev.args);
      break;
    case "tool_execution_update":
      updateToolResult(ev.toolCallId, ev.partialResult, "running");
      break;
    case "tool_execution_end":
      updateToolResult(ev.toolCallId, ev.result, ev.isError ? "error" : "done");
      break;
    case "extension_ui_request":
      handleExtUI(ev);
      break;
    case "compaction_start":
      toast("♻️ 上下文压缩中...");
      break;
    case "compaction_end":
      toast("✅ 压缩完成");
      break;
  }
});

socket.on("pi_error", (d) => { toast(d.error, true); leaveStreamMode(); setBadge(false); });
socket.on("pi_disconnected", (d) => {
  if (d.code !== 0) toast("⚠️ Pi 进程断开 (code="+d.code+")", true);
  leaveStreamMode(); setBadge(false);
});

// ─── Assistant Bubble (streaming) ─────────────────────────────────────────
function startAsstBubble() {
  if (curAsst) { curAsst.classList.remove("streaming"); }
  curAsst = makeMsgEl("assistant", '<div class="bub-body"><p class="stream-text"></p></div>');
  curAsst.classList.add("streaming");
  curToolEls = {};
}
function updateAsst(delta) {
  if (!curAsst || !delta) return;
  const body = curAsst.querySelector(".bub-body");
  if (!body) return;

  if (delta.type === "text_delta") {
    let p = body.querySelector(".stream-text");
    if (!p) { p = document.createElement("p"); p.className="stream-text"; body.appendChild(p); }
    p.textContent += delta.delta || "";
  } else if (delta.type === "thinking_delta") {
    let det = body.querySelector(".think.streaming");
    if (!det) {
      det = document.createElement("details"); det.className="think streaming"; det.open = false;
      det.innerHTML = "<summary>🧠 思考过程</summary><div class='tc'></div>";
      body.appendChild(det);
    }
    det.querySelector(".tc").textContent += delta.delta || "";
  } else if (delta.type === "toolcall_end" && delta.toolCall) {
    const tc = delta.toolCall;
    const det = document.createElement("details");
    det.className = "tool"; det.dataset.tcid = tc.id; det.open = false;
    det.innerHTML = `<summary>⏳ ${esc(tc.name)}</summary>
      <div class="tb">
        <div class="ta">${esc(typeof tc.arguments==="string"?tc.arguments:JSON.stringify(tc.arguments||{},null,2))}</div>
        <div class="tr" style="display:none"></div>
      </div>`;
    body.appendChild(det);
    curToolEls[tc.id] = det;
  }
  scrollBot();
}
function ensureToolBlock(tcid, name, args) {
  let el = curToolEls[tcid];
  if (!el && curAsst) {
    const body = curAsst.querySelector(".bub-body");
    if (body) {
      el = document.createElement("details");
      el.className = "tool"; el.dataset.tcid = tcid; el.open = true;
      el.innerHTML = `<summary>⏳ ${esc(name)}</summary>
        <div class="tb">
          <div class="ta">${esc(typeof args==="string"?args:JSON.stringify(args||{},null,2))}</div>
          <div class="tr" style="display:none"></div>
        </div>`;
      body.appendChild(el);
      curToolEls[tcid] = el;
    }
  } else if (el) {
    el.querySelector("summary").innerHTML = `⏳ ${esc(name)}`;
    el.open = true;
  }
}
function updateToolResult(tcid, result, status) {
  const el = curToolEls[tcid];
  if (!el) return;
  const sum = el.querySelector("summary");
  const tr = el.querySelector(".tr");
  if (status === "running") {
    if (tr && result?.content) {
      tr.textContent = result.content.map(c=>c.text||"").join("\n");
      tr.style.display = "block";
    }
  } else {
    if (sum) sum.innerHTML = `${status==="error"?"❌":"✅"} ${sum.textContent.replace(/^[⏳✅❌]\s*/,"")}`;
    if (tr && result?.content) {
      tr.textContent = result.content.map(c=>c.text||"").join("\n");
      tr.style.display = "block";
    }
    if (status === "done") setTimeout(()=>{el.open=false}, 600);
    else el.open = true;
  }
  scrollBot();
}
function finishAsstBubble(messages) {
  // Re-render from full message content if available
  if (curAsst && messages && messages.length > 0) {
    const last = messages[messages.length-1];
    if (last && last.content) {
      const body = curAsst.querySelector(".bub-body");
      if (body) body.innerHTML = renderBlocks(last.content);
    }
    curAsst.classList.remove("streaming");
  }
  curAsst = null; curToolEls = {};
  scrollBot();
}

// ─── Render Content Blocks ────────────────────────────────────────────────
function renderBlocks(content) {
  if (!content) return "";
  if (typeof content === "string") return "<p>" + MD.parse(content) + "</p>";
  if (!Array.isArray(content)) return "";
  return content.map(blk => {
    if (blk.type === "text") return MD.parse(blk.text || "");
    if (blk.type === "thinking") {
      return `<details class="think"><summary>🧠 思考过程</summary><div class="tc">${esc(blk.thinking||"")}</div></details>`;
    }
    if (blk.type === "toolCall") {
      const argsStr = blk.arguments ? (typeof blk.arguments==="string"?blk.arguments:JSON.stringify(blk.arguments||{},null,2)) : "";
      const hasRes = blk.result?.content;
      const resText = hasRes ? blk.result.content.map(c=>c.text||"").join("\n") : "";
      return `<details class="tool"${blk.isError?" open":""}>
        <summary>${blk.isError?"❌":"✅"} ${esc(blk.name||"tool")}</summary>
        <div class="tb">
          ${argsStr?`<div class="ta">${esc(argsStr)}</div>`:""}
          ${hasRes?`<div class="tr">${esc(resText)}</div>`:""}
        </div></details>`;
    }
    return "";
  }).join("");
}

// ─── Message DOM ──────────────────────────────────────────────────────────
function appendMsg(msg) {
  if (msg.role === "user") {
    const txt = typeof msg.content === "string" ? msg.content : "";
    makeMsgEl("user", esc(txt));
  } else if (msg.role === "assistant") {
    makeMsgEl("assistant", '<div class="bub-body">' + renderBlocks(msg.content) + '</div>');
  }
  scrollBot();
}
function makeMsgEl(role, inner) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = '<div class="bub">' + inner + '</div>';
  $msgs.appendChild(d);
  return d;
}

// ─── Extension UI ─────────────────────────────────────────────────────────
function handleExtUI(ev) {
  switch (ev.method) {
    case "select": {
      const v = prompt(ev.title+"\n\n"+ev.options.join("\n"), ev.options[0]);
      replyExt(ev.id, { value: v || ev.options[0] }); break;
    }
    case "confirm": {
      const ok = confirm((ev.title||"")+"\n"+(ev.message||""));
      replyExt(ev.id, { confirmed: ok }); break;
    }
    case "input": {
      const v = prompt(ev.title, ev.placeholder||"");
      replyExt(ev.id, { value: v || "" }); break;
    }
    case "editor": {
      const v = prompt(ev.title, ev.prefill||"");
      replyExt(ev.id, { value: v || "" }); break;
    }
    case "notify": {
      const icon = ev.notifyType==="error"?"❌":ev.notifyType==="warning"?"⚠️":"ℹ️";
      toast(icon+" "+ev.message, ev.notifyType==="error"); break;
    }
  }
}
function replyExt(id, data) {
  socket.emit("extension_ui_response", { sessionId: activeSid, response: { type:"extension_ui_response", id, ...data } });
}

// ─── Image Paste ──────────────────────────────────────────────────────────
document.addEventListener("paste", (e) => {
  if (!activeSid) return;
  for (const item of (e.clipboardData?.items||[])) {
    if (item.type.startsWith("image/")) {
      e.preventDefault();
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = () => {
        pendingImgs.push({ data: reader.result.split(",")[1], mimeType: blob.type });
        renderImgs();
        $send.disabled = false;
      };
      reader.readAsDataURL(blob);
    }
  }
});
function renderImgs() {
  $imgPrev.style.display = "flex";
  $imgPrev.innerHTML = pendingImgs.map((img,i)=>`
    <div class="ip"><img src="data:${img.mimeType};base64,${img.data}"><button onclick="rmImg(${i})">✕</button></div>
  `).join("");
}
function rmImg(i) { pendingImgs.splice(i,1); if (!pendingImgs.length) $imgPrev.style.display="none"; renderImgs(); $send.disabled = !$inp.value.trim() && !pendingImgs.length; }

// ─── Input ────────────────────────────────────────────────────────────────
$inp.addEventListener("keydown", (e) => { if (e.key==="Enter"&&!e.shiftKey) { e.preventDefault(); sendMsg(); } });
$inp.addEventListener("input", () => {
  $inp.style.height = "auto"; $inp.style.height = Math.min($inp.scrollHeight, 160) + "px";
  $send.disabled = !$inp.value.trim() && pendingImgs.length===0;
});
function scrollBot() { requestAnimationFrame(() => { $msgs.scrollTop = $msgs.scrollHeight; }); }

// ─── Auto-restore session on page load ────────────────────────────────────
(function(){
  refreshSessions();
  const saved = localStorage.getItem(LS_KEY_SESSION);
  if (saved) {
    // Need to wait for session list to load first
    setTimeout(() => {
      if (sessCache.some(s => s.id === saved)) {
        joinSession(saved);
      } else {
        localStorage.removeItem(LS_KEY_SESSION);
      }
    }, 500);
  }
  setInterval(refreshSessions, 10000);
})();
</script>
